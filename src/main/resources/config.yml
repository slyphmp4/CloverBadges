newcomer:
  enabled: true
  badge-id: "newcomer"
  duration: "7d"
  auto-display: true

selection:
  clear-invalid-selection: true

display:
  max-badges: 2
  separator: " "

nametag:
  enabled: true
  only-for-gradients: true
  renderer: "AUTO"
  hide-vanilla-with-tab: true
  use-tab-prefix-suffix: true
  armor-stand-fallback: true
  refresh-interval-ticks: 10
  text-display:
    shadowed: true
    see-through: false
    default-background: false
    line-width: 1024
    view-range: 1.0
  armor-stand:
    y-offset: 1.0
  fallback:
    prefix: ""
    suffix: ""
    badge-separator: " "

limits:
  max-owned-badges: 10

placeholders:
  empty-value: ""
  permanent-text: "навсегда"
  expired-text: "0с"

minecraft-heads:
  api:
    enabled: true
    app-uuid: ""
    api-key: ""
    demo: false
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

storage:
  save-on-change: true
  cleanup-interval-ticks: 6000
