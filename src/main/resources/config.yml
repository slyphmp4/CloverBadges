newcomer:
  enabled: true
  badge-id: "newcomer"
  duration: "7d"
  auto-display: true

selection:
  clear-invalid-selection: true

display:
  max-badges: 2
  separator: " "

limits:
  max-owned-badges: 10

placeholders:
  empty-value: ""
  permanent-text: "навсегда"
  expired-text: "0с"

storage:
  save-on-change: true
  cleanup-interval-ticks: 6000
