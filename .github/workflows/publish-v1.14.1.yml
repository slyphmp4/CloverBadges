name: Publish CloverBadges v1.14.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.14.1.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'slyphmp4/CloverBadges'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/CloverBadges-1.14.1.jar
          sha256sum build/libs/CloverBadges-1.14.1.jar > build/libs/CloverBadges-1.14.1.jar.sha256
          cat > release-notes.md <<'EOF'
          ## What's new
          - Added full message color customization with permanent and timed grants.
          - Added 20 message color palettes with HEX and multi-stop gradients.
          - Added a dedicated message colors GUI with selection, removal, previews and pagination.
          - Added PlaceholderAPI support for selected message color data.
          - Added `/badge give/remove ... messagepaint ...` support with permission-aware tab completion.
          - Added persistent message color storage and config migration.
          - Message color entries now use configurable `PLAYER_HEAD` icons so every palette can have its own editable texture.
          - Improved top-level GUI navigation between badges, nickname colors and message colors.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.14.1 \
            build/libs/CloverBadges-1.14.1.jar \
            build/libs/CloverBadges-1.14.1.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target a795980dc9b3008eb1e1822512a1b88b13a18b46 \
            --title "CloverBadges v1.14.1" \
            --notes-file release-notes.md \
            --latest
