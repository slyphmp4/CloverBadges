name: Build CloverBadges

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    needs: [previous-api, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew clean build --stacktrace --warning-mode=fail

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CloverBadges
          path: build/libs/CloverBadges-*.jar
          if-no-files-found: error

      - name: Read version
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release CloverBadges v')
        id: version
        shell: bash
        run: |
          VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release CloverBadges v')
        shell: bash
        run: sha256sum "build/libs/CloverBadges-${{ steps.version.outputs.version }}.jar" > "build/libs/CloverBadges-${{ steps.version.outputs.version }}.jar.sha256"

      - name: Delete merged release branch
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release CloverBadges v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(printf '%s\n' "$RELEASE_MESSAGE" | awk '$1 == "Release-PR:" {print $2}')
          EXPECTED_HEAD=$(printf '%s\n' "$RELEASE_MESSAGE" | awk '$1 == "Release-Head:" {print $2}')
          if [ -z "$PR_NUMBER" ] && [ -z "$EXPECTED_HEAD" ]; then
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg base "$GITHUB_REF_NAME" --arg head "$EXPECTED_HEAD" \
            '.merged == true and .head.repo.full_name == $repository and .base.ref == $base and .head.ref != $base and .head.sha == $head' \
            <<< "$PR_JSON" > /dev/null
          HEAD_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
          REMOTE_HEAD=$(git ls-remote --heads origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')
          if [ -z "$REMOTE_HEAD" ]; then
            exit 0
          fi
          [ "$REMOTE_HEAD" = "$EXPECTED_HEAD" ]
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}"

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release CloverBadges v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "build/libs/CloverBadges-${{ steps.version.outputs.version }}.jar" \
            "build/libs/CloverBadges-${{ steps.version.outputs.version }}.jar.sha256" \
            --title "CloverBadges v${{ steps.version.outputs.version }}" \
            --generate-notes

  previous-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile against the previous API
        run: ./gradlew clean build -PpaperApiVersion=26.2.build.110-stable --stacktrace --warning-mode=fail

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            build: 110
            integrations: false
          - minecraft: '26.3'
            build: 253
            integrations: false
          - minecraft: '26.3'
            build: 253
            integrations: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the same 26.3 artifact for every runtime
        run: ./gradlew clean build smokeTestJar --stacktrace --warning-mode=fail
      - name: Test startup, features, shutdown and restart
        shell: bash
        run: |
          EXTRA=()
          if [ '${{ matrix.integrations }}' = 'true' ]; then
            EXTRA+=(--placeholderapi --tab)
          fi
          python3 scripts/run_smoke.py \
            --minecraft '${{ matrix.minecraft }}' \
            --build '${{ matrix.build }}' \
            "${EXTRA[@]}"
      - name: Upload smoke reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.minecraft }}-${{ matrix.integrations }}
          path: |
            build/smoke/**/*.yml
            build/smoke/**/*.log
          if-no-files-found: warn
