name: Build CloverBadges

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CloverBadges
          path: build/libs/CloverBadges-*.jar
          if-no-files-found: error

      - name: Read version
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release CloverBadges v')
        id: version
        shell: bash
        run: |
          VERSION=$(gradle properties -q | awk '/^version:/ {print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release CloverBadges v')
        shell: bash
        run: sha256sum "build/libs/CloverBadges-${{ steps.version.outputs.version }}.jar" > "build/libs/CloverBadges-${{ steps.version.outputs.version }}.jar.sha256"

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release CloverBadges v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "build/libs/CloverBadges-${{ steps.version.outputs.version }}.jar" \
            "build/libs/CloverBadges-${{ steps.version.outputs.version }}.jar.sha256" \
            --title "CloverBadges v${{ steps.version.outputs.version }}" \
            --notes "## What's new
          - Fixed nickname color inheritance from badge formatting for players without a selected nickname color.
          - Nickname placeholders now reset inherited formatting before and after the nickname."
