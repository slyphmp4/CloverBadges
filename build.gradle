plugins {
    id 'java'
}

group = 'com.slyph'
version = '1.14.4'

def paperApiVersion = providers.gradleProperty('paperApiVersion').getOrElse('26.3.build.253-stable')
def pluginVersion = version.toString()

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/releases/'
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'com.github.NEZNAMY:TAB-API:6.1.2'
    compileOnly 'org.projectlombok:lombok:1.18.42'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property('version', pluginVersion)
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

jar {
    archiveBaseName = 'CloverBadges'
    archiveVersion = pluginVersion
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}

tasks.register('smokeTestJar', Jar) {
    dependsOn tasks.named('smokeTestClasses')
    archiveBaseName = 'CloverBadgesSmokeTest'
    archiveVersion = pluginVersion
    from sourceSets.smokeTest.output
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
